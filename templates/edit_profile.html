{% extends 'base.html' %}

{% block title %}Edit Profile - Express Delivery{% endblock %}

{% block content %}
<h1>Edit Profile</h1>

<div class="card">
    <form method="POST" action="{{ url_for('edit_profile') }}">

        <div style="margin-bottom: 15px;">
            <label for="first_name">First Name:</label>
            <input type="text" id="first_name" name="first_name" value="{{ customer.first_name }}" required>
        </div>

        <div style="margin-bottom: 15px;">
            <label for="last_name">Last Name:</label>
            <input type="text" id="last_name" name="last_name" value="{{ customer.last_name }}" required>
        </div>

        <div style="margin-bottom: 15px;">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="{{ customer.email }}" required>
        </div>

        <div style="margin-bottom: 15px;">
            <label for="phone">Phone Number:</label>
            <input type="text" id="phone" name="phone" value="{{ customer.number }}" required>
            <small>Only digits and spaces allowed.</small>
        </div>

        <div style="margin-bottom: 15px;">
            <label for="address">Address:</label>
            <input type="text" id="address" name="address" value="{{ customer.address }}" required>
        </div>

        <div style="margin-bottom: 15px;">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" value="{{ customer.password }}" required>
        </div>

        <div style="margin-top: 20px;">
            <button type="submit" class="btn">Save Changes</button>
            <a href="{{ url_for('dashboard') }}" class="btn"
                style="background-color: #95a5a6; margin-left: 10px;">Cancel</a>
        </div>

    </form>
</div>
{% endblock %}
