{% extends 'base.html' %}

{% block title %}Register - Express Delivery{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <h2 style="text-align: center;">Register</h2>
    <form action="{{ url_for('register') }}" method="POST">
        <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex: 1;">
                <label for="first_name">First Name</label>
                <input type="text" id="first_name" name="first_name" required>
            </div>
            <div class="form-group" style="flex: 1;">
                <label for="last_name">Last Name</label>
                <input type="text" id="last_name" name="last_name" required>
            </div>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required placeholder="0912 345 678">
        </div>

        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" name="address" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>

        <div class="form-group">
            <label for="customer_type">Customer Type</label>
            <select name="customer_type" id="customer_type" onchange="toggleFields()"
                style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ddd;">
                <option value="Normal">Normal</option>
                <option value="Contracted">Contracted</option>
                <option value="Sponsored">Sponsored</option>
            </select>
        </div>

        <div class="form-group" id="account_field" style="display: none;">
            <label for="account">Account Number</label>
            <input type="text" id="account" name="account" placeholder="For Contracted Customers">
        </div>

        <div class="form-group" id="sponsor_field" style="display: none;">
            <label for="sponsor_id">Sponsor ID</label>
            <input type="text" id="sponsor_id" name="sponsor_id" placeholder="For Sponsored Customers">
        </div>

        <div class="form-group" id="billing_pref_group">
            <label for="billing_pref">Billing Preference</label>
            <select name="billing_pref" id="billing_pref"
                style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ddd;">
                <option value="in_advance">In Advance</option>
                <option value="on_delivery">On Delivery</option>
                <option value="monthly">Monthly</option>
            </select>
        </div>

        <script>
            function toggleFields() {
                var type = document.getElementById("customer_type").value;
                document.getElementById("account_field").style.display = (type === "Contracted") ? "block" : "none";
                document.getElementById("sponsor_field").style.display = (type === "Sponsored") ? "block" : "none";

                var billingSelect = document.getElementById("billing_pref");
                var options = billingSelect.options;

                // Reset all options to enabled first
                for (var i = 0; i < options.length; i++) {
                    options[i].hidden = false;
                    options[i].disabled = false;
                }

                if (type === "Contracted") {
                    // Contracted: Only Monthly
                    for (var i = 0; i < options.length; i++) {
                        if (options[i].value !== "monthly") {
                            options[i].hidden = true;
                            options[i].disabled = true;
                        }
                    }
                    billingSelect.value = "monthly";

                } else if (type === "Normal") {
                    // Normal: In Advance or On Delivery
                    for (var i = 0; i < options.length; i++) {
                        if (options[i].value === "monthly") {
                            options[i].hidden = true;
                            options[i].disabled = true;
                        }
                    }
                    // Default to In Advance if currently correctly selected or if switching from Contracted
                    if (billingSelect.value === "monthly") {
                        billingSelect.value = "in_advance";
                    }

                } else if (type === "Sponsored") {
                    // Sponsored: Only In Advance
                    for (var i = 0; i < options.length; i++) {
                        if (options[i].value !== "in_advance") {
                            options[i].hidden = true;
                            options[i].disabled = true;
                        }
                    }
                    billingSelect.value = "in_advance";
                }

                // Ensure enabled state for submission
                billingSelect.disabled = false;
            }

            // Run on load to set initial state
            window.onload = toggleFields;
        </script>

        <button type="submit" class="btn" style="width: 100%;">Register</button>
    </form>
    <p style="text-align: center; margin-top: 15px;">
        Already have an account? <a href="{{ url_for('login') }}">Login here</a>
    </p>
</div>
{% endblock %}
