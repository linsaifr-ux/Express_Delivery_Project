{% extends 'base.html' %}

{% block title %}Register - Express Delivery{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <h2 style="text-align: center;">Register</h2>
    <form action="{{ url_for('register') }}" method="POST">
        <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex: 1;">
                <label for="first_name">First Name</label>
                <input type="text" id="first_name" name="first_name" required>
            </div>
            <div class="form-group" style="flex: 1;">
                <label for="last_name">Last Name</label>
                <input type="text" id="last_name" name="last_name" required>
            </div>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required placeholder="0912 345 678">
        </div>

        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" name="address" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>

        <div class="form-group">
            <label for="billing_pref">Billing Preference</label>
            <select name="billing_pref" id="billing_pref"
                style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ddd;">
                <option value="in_advance">In Advance</option>
                <option value="immediate_payment">Immediate Payment</option>
                <option value="monthly">Monthly</option>
            </select>
        </div>

        <button type="submit" class="btn" style="width: 100%;">Register</button>
    </form>
    <p style="text-align: center; margin-top: 15px;">
        Already have an account? <a href="{{ url_for('login') }}">Login here</a>
    </p>
</div>
{% endblock %}
